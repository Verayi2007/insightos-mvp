<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightOS MVP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="InsightOS navigation">
        <div class="brand">
          <div class="brand-mark">IO</div>
          <div>
            <p class="eyebrow">InsightOS</p>
            <h1>商业认知驾驶舱</h1>
          </div>
        </div>
        <nav class="nav">
          <button class="nav-button active" data-view="today" type="button">今日重点</button>
          <button class="nav-button" data-view="articles" type="button">文章卡片</button>
          <button class="nav-button" data-view="models" type="button">决策模型</button>
          <button class="nav-button" data-view="institutions" type="button">机构报告</button>
        </nav>
        <section class="sync-panel">
          <span class="status-dot"></span>
          <div>
            <strong>本地优先</strong>
            <p>连接你自己的 IMA 知识库</p>
          </div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">MVP iteration · 2026-06-04</p>
            <h2 id="view-title">今日重点</h2>
          </div>
          <div class="toolbar">
            <label class="search">
              <span>搜索</span>
              <input id="search-input" type="search" placeholder="模型、机构、报告、文章" />
            </label>
            <button class="primary-action" id="open-models" type="button">查看模型库</button>
          </div>
        </header>

        <section class="view view-active" id="today-view">
          <div class="metrics" id="metrics"></div>
          <div class="today-grid">
            <section class="panel main-panel">
              <div class="section-heading">
                <p class="eyebrow">Extraction focus</p>
                <h3>本轮提取重点</h3>
              </div>
              <div id="insight-list" class="insight-list"></div>
            </section>
            <section class="panel">
              <div class="section-heading">
                <p class="eyebrow">Practice</p>
                <h3>今日 3 问</h3>
              </div>
              <ol id="daily-questions" class="question-list"></ol>
            </section>
          </div>
          <section class="panel">
            <div class="section-heading">
              <p class="eyebrow">High signal</p>
              <h3>高频模型与机构</h3>
            </div>
            <div id="focus-strip" class="article-strip"></div>
          </section>
        </section>

        <section class="view" id="articles-view">
          <div class="split-layout">
            <section class="panel">
              <div class="section-heading">
                <p class="eyebrow">Knowledge cards</p>
                <h3>文章卡片</h3>
              </div>
              <div class="filter-row" id="model-filters"></div>
              <div id="article-list" class="article-list"></div>
            </section>
            <aside class="panel detail-panel" id="article-detail"></aside>
          </div>
        </section>

        <section class="view" id="models-view">
          <div class="split-layout">
            <section class="panel">
              <div class="section-heading">
                <p class="eyebrow">Decision models</p>
                <h3>思维决策模型</h3>
              </div>
              <div id="model-list" class="catalog-list"></div>
            </section>
            <aside class="panel detail-panel" id="model-detail"></aside>
          </div>
        </section>

        <section class="view" id="institutions-view">
          <div class="split-layout">
            <section class="panel">
              <div class="section-heading">
                <p class="eyebrow">Institutions & reports</p>
                <h3>机构与财报索引</h3>
              </div>
              <div id="institution-list" class="catalog-list"></div>
            </section>
            <aside class="panel detail-panel" id="institution-detail"></aside>
          </div>
        </section>
      </main>
    </div>

    <script src="./data/sample.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
